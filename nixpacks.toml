# Explicit Nixpacks phase plan for the Railway API service.
#
# Without this, Nixpacks auto-detects providers from repo contents. Because
# the repo root has both package.json (pnpm workspace) and pyproject.toml
# (uv workspace), Nixpacks was including a Node/pnpm "setup" and "install"
# phase before our own build/start commands ever ran — which the API
# service doesn't need at all, and which was failing on an unrelated
# Node/corepack bug. This file replaces phase auto-detection entirely:
# only Python and curl are installed, and pnpm/Node are never involved.
#
# See DEPLOYMENT_AND_ENV.md section 11.1 and railway.json (deploy-phase
# start command, healthcheck, and restart policy).

[phases.setup]
nixPkgs = ["python312", "curl"]

[phases.install]
cmds = ["curl -LsSf https://astral.sh/uv/install.sh | sh"]

[phases.build]
cmds = ["$HOME/.local/bin/uv sync --package rkpr-api"]
