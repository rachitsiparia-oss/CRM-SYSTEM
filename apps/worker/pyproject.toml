[project]
name = "rkpr-worker"
version = "0.1.0"
description = "RKPR Restaurant CRM - ARQ background worker and scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arq==0.28.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "psycopg[binary,pool]==3.3.4",
  "structlog==26.1.0",
  "sentry-sdk==2.66.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
  "mypy==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
