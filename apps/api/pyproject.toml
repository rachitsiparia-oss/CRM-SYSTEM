[project]
name = "rkpr-api"
version = "0.1.0"
description = "RKPR Restaurant CRM - authoritative FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.140.0",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "psycopg[binary,pool]==3.3.4",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "sentry-sdk[fastapi]==2.66.1",
  "pyjwt[crypto]==2.10.1",
  "pillow>=12.3.0",
  "python-multipart>=0.0.32",
  "openpyxl>=3.1.5",
  "playwright>=1.62.0",
  "redis>=5.0.0,<6.0.0",
  "prometheus-client>=0.21.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
  "mypy==2.3.0",
  "types-openpyxl>=3.1.5.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
